name: risksentinel

services:
  risk-sentinel:
    build: .
    container_name: risk-sentinel
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-please}
      - WORKERS=${WORKERS:-2}
      - TIMEOUT=${TIMEOUT:-120}
    volumes:
      - vuln_data:/app/instance      # SQLite database
      - vuln_uploads:/app/uploads    # Imported CSV files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/login')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  vuln_data:
    driver: local
  vuln_uploads:
    driver: local
